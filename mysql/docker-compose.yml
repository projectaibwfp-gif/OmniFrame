services:
  mysql:
    image: mysql:8.4
    container_name: project-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: project_ai
      MYSQL_USER: project_user
      MYSQL_PASSWORD: project_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./01-create-database.sql:/docker-entrypoint-initdb.d/01-create-database.sql:ro
      - ./02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./03-seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
