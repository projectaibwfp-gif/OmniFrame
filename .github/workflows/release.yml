name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs:
      - ci
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: |
          cd frontend && npm ci && npm run format
          cd ../backend && npm ci && npm run format
      - run: node scripts/release.mjs
      - run: |
          if git diff --quiet HEAD -- \
            frontend/package.json frontend/package-lock.json \
            backend/package.json backend/package-lock.json releases.yaml; then
            echo "No application changes require a release."
            exit 0
          fi

          FRONT_TAG=""
          BACKEND_TAG=""
          RELEASE_COMPONENTS=""

          if ! git diff --quiet HEAD -- frontend/package.json frontend/package-lock.json; then
            FRONT_TAG="frontend-v$(node -p "require('./frontend/package.json').version")"
            RELEASE_COMPONENTS="frontend"
          fi

          if ! git diff --quiet HEAD -- backend/package.json backend/package-lock.json; then
            BACKEND_TAG="backend-v$(node -p "require('./backend/package.json').version")"
            RELEASE_COMPONENTS="${RELEASE_COMPONENTS:+${RELEASE_COMPONENTS}, }backend"
          fi

          git add -A
          git commit -m "chore: release ${RELEASE_COMPONENTS} [skip ci]"

          if [ -n "$FRONT_TAG" ]; then
            git tag "$FRONT_TAG"
          fi
          if [ -n "$BACKEND_TAG" ]; then
            git tag "$BACKEND_TAG"
          fi

          git push origin HEAD:main --tags
