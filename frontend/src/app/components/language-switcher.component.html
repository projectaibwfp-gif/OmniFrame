<div class="language-switcher">
  <button
    class="lang-btn"
    [class.active]="localizationService.currentLocale() === 'en'"
    (click)="setLocale('en')"
    type="button"
    title="English"
  >
    🇬🇧
  </button>
  <button
    class="lang-btn"
    [class.active]="localizationService.currentLocale() === 'pl'"
    (click)="setLocale('pl')"
    type="button"
    title="Polski"
  >
    🇵🇱
  </button>
</div>
